name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout stable site
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-site
      - name: Checkout Python site
        uses: actions/checkout@v4
        with:
          ref: feature/python-control-ui
          path: python-site
      - name: Assemble stable and Python sites
        run: |
          mkdir public-site
          rsync -a --exclude='.git' stable-site/ public-site/
          mkdir public-site/python
          rsync -a --exclude='.git' python-site/ public-site/python/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
