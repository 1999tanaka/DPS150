<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-labelledby="title desc">
  <title id="title">固定電圧・固定電流制限の出力例</title>
  <desc id="desc">Control Cycle 50ミリ秒で、13.5ボルトと0.100アンペアの電流制限を約10秒間維持するグラフ。</desc>
  <rect width="760" height="250" rx="12" fill="#07111d"/>
  <text x="24" y="28" fill="#e7f2f5" font-family="sans-serif" font-size="16" font-weight="600">Fixed output · Control Cycle 50 ms</text>
  <g stroke="#263846" stroke-width="1">
    <path d="M70 48H732M70 101H732M70 154H732"/>
    <path d="M70 48V154M236 48V154M401 48V154M567 48V154M732 48V154"/>
  </g>
  <rect x="70" y="48" width="662" height="106" fill="none" stroke="#506574"/>
  <g fill="#9db0ba" font-family="sans-serif" font-size="11">
    <text x="35" y="52">14.0</text><text x="35" y="105">13.5</text><text x="35" y="158">13.0</text>
    <text x="67" y="173">0</text><text x="232" y="173">2.5</text><text x="397" y="173">5.0</text><text x="563" y="173">7.5</text><text x="724" y="173">10</text>
    <text x="10" y="105" transform="rotate(-90 10 105)">Voltage [V]</text>
    <text x="374" y="188">Time [s]</text>
  </g>
  <path d="M70 101H732" fill="none" stroke="#37d6cf" stroke-width="3"/>
  <circle cx="70" cy="101" r="4" fill="#37d6cf"/><circle cx="732" cy="101" r="4" fill="#37d6cf"/>
  <text x="610" y="91" fill="#8cf1ec" font-family="sans-serif" font-size="12">13.500 V</text>
  <rect x="70" y="202" width="662" height="26" fill="#0b1a26" stroke="#506574"/>
  <path d="M240 215H732" fill="none" stroke="#ffb347" stroke-width="3"/>
  <text x="78" y="220" fill="#ffcf89" font-family="sans-serif" font-size="12">Current limit 0.100 A</text>
</svg>
